name: Update lightning

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions supports a minimum scheduled frequency of 5 minutes.
    - cron: "2/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-lightning-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync latest repo
        run: |
          git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install live packages
        run: |
          pip install requests

      - name: Prepare data folder
        run: mkdir -p data

      - name: Run lightning once
        run: python lightning_live_map.py
        env:
          RUN_ONCE: "1"

      - name: Convert latest lightning to GeoJSON
        run: python csv_to_geojson.py

      - name: Commit and push lightning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- data/

          if git diff --cached --quiet; then
            echo "No lightning changes."
            exit 0
          fi

          git commit -m "Update lightning"

          # Never create a merge commit or silently ignore a failed rebase.
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              echo "ERROR: Cannot safely reconcile CSV changes with main."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Lightning CSV update safely pushed."
              exit 0
            fi
            echo "Push race (attempt $attempt); retrying in 5 seconds."
            sleep 5
          done
          echo "ERROR: GitHub rejected all five push attempts."
          exit 1
